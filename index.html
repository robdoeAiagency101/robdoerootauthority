<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rob Doe | Executive Hub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #080808; color: #f0f0f0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; }
        .hero { text-align: center; margin-bottom: 60px; }
        .hero h1 { font-size: 3.5rem; font-weight: 700; letter-spacing: -1px; color: #fff; }
        .hero p { font-size: 1.2rem; color: #888; margin-top: 12px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; width: 100%; max-width: 840px; }
        .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); border-radius: 14px; padding: 28px 24px; text-decoration: none; color: #f0f0f0; transition: all 0.25s ease; position: relative; overflow: hidden; }
        .card:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.2); transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .card .icon { font-size: 1.8rem; margin-bottom: 12px; }
        .card h2 { font-size: 1.05rem; font-weight: 600; margin-bottom: 6px; color: #fff; }
        .card p { font-size: 0.85rem; color: #777; line-height: 1.4; }
        .footer { margin-top: 60px; font-size: 0.8rem; color: #444; }
    </style>
</head>
<body>
    <div class="hero">
        <h1>Rob Doe</h1>
        <p>Builder. Investor. Web3 Pioneer.</p>
    </div>
    <div class="grid">
        <a href="web3.html" class="card">
            <div class="icon">🌐</div>
            <h2>Web3 Projects</h2>
            <p>Blockchain domains and decentralised ventures</p>
        </a>
        <a href="portfolio.html" class="card">
            <div class="icon">📁</div>
            <h2>Portfolio</h2>
            <p>Domain holdings and digital assets</p>
        </a>
        <a href="connect.html" class="card">
            <div class="icon">🤝</div>
            <h2>Connect</h2>
            <p>Get in touch or collaborate</p>
        </a>
        <a href="aiagency.html" class="card">
            <div class="icon">🧠</div>
            <h2>AI Agency</h2>
            <p>aiagency101 and automation projects</p>
        </a>
    </div>
    <div class="footer">© 2026 Rob Doe. All rights reserved.</div>
</body>
</html>
